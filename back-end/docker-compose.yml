services:
  postgres:
    image: postgres:18-alpine
    container_name: shopify_api_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopify_api

    ports:
      - '5433:5432'

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d shopify_api']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
